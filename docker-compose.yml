services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ritvizier
      POSTGRES_USER: ritvizier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritvizier"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ritvizier:${POSTGRES_PASSWORD:-local-development}@db:5432/ritvizier
      CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
