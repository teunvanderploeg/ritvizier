name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan Git history without exposing values
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --log-opts=--all --redact=100
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e 'backend[dev]'
      - run: ruff check backend
      - run: mypy backend/app
      - run: pytest backend/tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: pip install -e 'backend[dev]'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failures, path: frontend/test-results/}
  containers:
    needs: [secrets, frontend, backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
      backend_image: ${{ steps.publish.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build production containers
        env:
          SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3000' }}
        run: |
          docker build -f frontend/Dockerfile --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --build-arg "NEXT_PUBLIC_SITE_URL=$SITE_URL" -t ritvizier-frontend:test .
          docker build -f backend/Dockerfile --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t ritvizier-backend:test .
      - name: Verify deployment and rollback
        run: python3 scripts/test-deployment.py
      - name: Verify Nginx configuration
        run: |
          mkdir -p artifacts/nginx-check
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/nginx-check/privkey.pem -out artifacts/nginx-check/fullchain.pem -days 1 -subj /CN=ritvizier.nl >/dev/null 2>&1
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/artifacts/nginx-check:/etc/letsencrypt/live/ritvizier.nl:ro" nginx:stable-alpine nginx -t
      - name: Check containers and PostgreSQL
        env:
          FRONTEND_IMAGE: ritvizier-frontend:test
          BACKEND_IMAGE: ritvizier-backend:test
          HTTP_PORT: 3109
        run: bash scripts/container-smoke.sh
      - name: Publish checked images
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in frontend backend; do
            image="$registry-$service:$GITHUB_SHA"
            docker tag "ritvizier-$service:test" "$image"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            echo "${service}_image=$digest" >> "$GITHUB_OUTPUT"
          done
          docker logout ghcr.io
  deploy:
    needs: containers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: ritvizier-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy checked image digests over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_PATH: ${{ vars.VPS_PATH || '/opt/ritvizier' }}
          SITE_URL: ${{ vars.SITE_URL }}
          FRONTEND_IMAGE: ${{ needs.containers.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.containers.outputs.backend_image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-vps.sh
