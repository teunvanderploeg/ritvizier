# Include inside nginx's http context, typically via /etc/nginx/sites-enabled/.
# Install the certificate for BOTH domains before enabling these TLS blocks.
limit_req_zone $binary_remote_addr zone=ritvizier_requests:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ritvizier.nl ritvizier.twanterstappen.nl;
    return 301 https://ritvizier.nl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ritvizier.twanterstappen.nl;
    ssl_certificate /etc/letsencrypt/live/ritvizier.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ritvizier.nl/privkey.pem;
    return 301 https://ritvizier.nl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ritvizier.nl;
    ssl_certificate /etc/letsencrypt/live/ritvizier.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ritvizier.nl/privkey.pem;
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req_status 429;

    location ~ ^/(api/|auto/) {
        limit_req zone=ritvizier_requests burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
