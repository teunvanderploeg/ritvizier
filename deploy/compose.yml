name: ritvizier
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ritvizier
      POSTGRES_USER: ritvizier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ritvizier -d ritvizier"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in release.env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://ritvizier:${POSTGRES_PASSWORD}@db:5432/ritvizier
      CORS_ORIGINS: ${SITE_URL:?Set SITE_URL}
      CACHE_TTL_SECONDS: 21600
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      RDW_APP_TOKEN: ${RDW_APP_TOKEN:-}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in release.env}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
volumes:
  postgres_data:
